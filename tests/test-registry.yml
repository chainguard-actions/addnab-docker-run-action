name: Test docker run with registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          run: echo registry-test-passed
          registry: docker.io
          username: anonymous
          password: anonymous
      - name: Assert action ran successfully
        run: |
          echo "Action with registry inputs completed"
          echo "PASS"
