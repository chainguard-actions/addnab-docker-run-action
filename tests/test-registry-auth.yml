name: Test registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          registry: registry-1.docker.io
          username: anonymous
          password: anonymous
          run: echo "registry-auth-test-passed"
        continue-on-error: true
      - name: Assert action ran (success or graceful failure on auth)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with registry/username/password inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (anonymous auth rejected by registry, inputs were exercised)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
