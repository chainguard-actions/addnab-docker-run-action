name: Test docker run options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run command with environment variable option
        id: action
        uses: .
        with:
          image: alpine:3.18
          options: -e MY_TEST_VAR=hello_options
          run: |
            if [ "$MY_TEST_VAR" = "hello_options" ]; then
              echo "env var is set correctly"
            else
              echo "env var not set: $MY_TEST_VAR"
              exit 1
            fi
      - name: Assert step succeeded
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed with options"
            exit 1
          fi
          echo "PASS: action ran successfully with docker options"
