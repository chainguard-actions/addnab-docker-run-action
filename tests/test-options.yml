name: Test options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          run: echo "TEST_VAR is $TEST_VAR"
          options: --env TEST_VAR=hello_options
      - name: Assert action completed successfully
        run: |
          echo "Action with options completed without error"
          echo "PASS"
