name: Test options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          run: echo "MY_VAR is $MY_VAR"
          options: --env MY_VAR=hello_from_options
      - name: Assert action completed successfully
        run: |
          echo "Action with options completed without error"
          echo "PASS"
