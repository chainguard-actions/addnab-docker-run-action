name: Test error handling - failing command causes step failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run a command that exits with non-zero in container
        id: action
        uses: .
        continue-on-error: true
        with:
          image: alpine:3.18
          run: exit 1
      - name: Assert step failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected step to fail when container exits with non-zero"
            exit 1
          fi
          echo "PASS: step correctly failed on non-zero exit"
