name: Test multiline run command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          run: |
            echo "step 1"
            echo "step 2"
            echo "step 3"
            VAL=42
            echo "VAL=$VAL"
            if [ "$VAL" != "42" ]; then
              echo "FAIL: variable not set"
              exit 1
            fi
            echo "PASS: multiline script works"
      - name: Assert step succeeded
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected multiline run to succeed"
            exit 1
          fi
          echo "PASS"
