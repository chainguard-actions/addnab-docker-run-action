name: Test docker options (env vars)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:3.18
          options: -e MY_TEST_VAR=hello_from_options
          run: |
            echo "MY_TEST_VAR=$MY_TEST_VAR"
            if [ "$MY_TEST_VAR" != "hello_from_options" ]; then
              echo "FAIL: env var not set correctly"
              exit 1
            fi
            echo "PASS: env var is set correctly"
      - name: Assert step succeeded
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected step to succeed"
            exit 1
          fi
          echo "PASS"
