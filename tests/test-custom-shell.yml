name: Test custom shell (bash)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: ubuntu:22.04
          shell: bash
          run: |
            echo "Running in bash"
            MYVAR="bash_works"
            echo "var=$MYVAR"
      - name: Assert step succeeded with bash shell
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected step to succeed with bash shell"
            exit 1
          fi
          echo "PASS"
