name: Test custom shell
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run command using bash shell in ubuntu container
        id: action
        uses: .
        with:
          image: ubuntu:22.04
          shell: bash
          run: echo "bash-shell-test"
      - name: Assert step succeeded
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed with bash shell"
            exit 1
          fi
          echo "PASS: action ran successfully with bash shell"
